<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K626 をめぐる星々｜裏サイト</title>
<style>
:root { --ink: #ece7da; --muted: #9aa3b2; --near: #f3d58c; --mid: #67dcc6; --far: #b99bff; --glass: rgba(10,14,22,.78); --edge: rgba(255,255,255,.09); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #03050a; color: var(--ink); font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
canvas.hot { cursor: pointer; }
.top { position: fixed; left: 16px; top: 14px; right: 16px; display: flex; align-items: flex-start; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand .ura { display: inline-block; font-size: 11px; letter-spacing: .35em; color: var(--muted); border: 1px solid var(--edge); border-radius: 4px; padding: 0 5px 0 8px; margin-right: 8px; vertical-align: 3px; }
.brand h1 { display: inline; margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .05em; text-shadow: 0 0 18px rgba(120,200,255,.25); }
.brand p { margin: 6px 0 0; max-width: 420px; font-size: 13px; line-height: 1.7; color: var(--muted); }
.top .right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; padding: 5px 12px; cursor: pointer; text-decoration: none; backdrop-filter: blur(6px); }
.btn:hover, .btn:focus-visible { border-color: rgba(103,220,198,.6); outline: none; }
.legend { position: fixed; left: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); pointer-events: none; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 8px currentColor; }
.hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 12px; color: var(--muted); pointer-events: none; transition: opacity .6s; white-space: nowrap; }

.card { position: fixed; right: 18px; top: 50%; width: min(400px, calc(100vw - 36px)); max-height: calc(100vh - 120px); overflow: auto;
  transform: translate(30px, -50%); opacity: 0; pointer-events: none; transition: opacity .45s, transform .45s cubic-bezier(.2,.8,.2,1);
  background: linear-gradient(160deg, rgba(18,26,40,.9), rgba(8,11,18,.9)); border: 1px solid var(--edge); border-radius: 16px; padding: 18px 20px 16px; backdrop-filter: blur(10px);
  box-shadow: 0 30px 80px -30px #000, 0 0 0 1px rgba(255,255,255,.03) inset; }
.card.on { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
@media (max-width: 760px) {
  .card { left: 10px; right: 10px; top: auto; bottom: 10px; width: auto; max-height: 58vh; transform: translateY(30px); }
  .card.on { transform: translateY(0); }
  .legend { display: none; }
  .brand p { max-width: 62vw; }
}
.card .ring { font-size: 11.5px; letter-spacing: .15em; display: flex; align-items: center; gap: 7px; }
.card .ring i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 10px currentColor; background: currentColor; }
.card h2 { margin: 6px 0 10px; font-size: 20px; font-weight: 600; line-height: 1.45; }
.card p { margin: 0 0 10px; font-size: 14.5px; line-height: 1.95; opacity: 0; transform: translateY(6px); animation: up .6s forwards; }
@keyframes up { to { opacity: 1; transform: none; } }
.card .x { position: absolute; right: 10px; top: 8px; font-size: 20px; line-height: 1; padding: 4px 8px; background: none; border: 0; color: var(--muted); cursor: pointer; }
.kakera { margin-top: 12px; border-top: 1px dashed var(--edge); padding-top: 10px; }
.kakera small { font-size: 11px; color: var(--muted); letter-spacing: .12em; margin-right: 6px; }
.kakera button { font: inherit; font-size: 11px; color: var(--muted); background: transparent; border: 1px solid var(--edge); border-radius: 999px; padding: 0 8px; margin: 2px 4px 2px 0; cursor: pointer; }
.kakera button.open { color: var(--ink); border-color: rgba(103,220,198,.6); }
.kakera .q { font-size: 12.5px; line-height: 1.8; color: #cfd6e2; margin-top: 8px; padding: 8px 10px; border-left: 2px solid var(--mid); background: rgba(0,0,0,.25); border-radius: 4px; }
.kakera .q mark { background: none; color: var(--near); }
.links { margin-top: 10px; font-size: 12px; color: var(--muted); }
.links button { font: inherit; font-size: 12px; color: var(--ink); background: rgba(255,255,255,.04); border: 1px solid var(--edge); border-radius: 999px; padding: 1px 10px; margin: 3px 4px 0 0; cursor: pointer; }

.list { position: fixed; inset: 0; background: rgba(3,5,10,.82); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 16px; }
.list.on { display: flex; }
.list .box { width: min(520px, 100%); max-height: 86vh; overflow: auto; background: rgba(12,17,27,.95); border: 1px solid var(--edge); border-radius: 14px; padding: 14px 16px; }
.list h3 { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .15em; margin: 12px 0 4px; }
.list button.s { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--edge); padding: 8px 4px; cursor: pointer; }
.list button.s:hover, .list button.s:focus-visible { background: rgba(255,255,255,.04); outline: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="K626 を中心に、推論の星が軌道を回る星図"></canvas>
<div class="top">
  <div class="brand"><span class="ura">裏</span><h1 id="title">K626</h1><p id="intro"></p></div>
  <div class="right"><button class="btn" id="openList">物語の一覧</button><a class="btn" href="../index.html">本サイトへ</a></div>
</div>
<div class="legend" id="legend"></div>
<div class="hint" id="hint">星に触れると、その物語が開きます</div>
<aside class="card" id="card" aria-live="polite"></aside>
<div class="list" id="list" role="dialog" aria-label="物語の一覧"><div class="box" id="listbox"></div></div>
<script>
const CV = document.getElementById('c'), X = CV.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL = { near: [243, 213, 140], mid: [103, 220, 198], far: [185, 155, 255] };
const RAD = { near: .19, mid: .31, far: .43 }, SPD = { near: .045, mid: .03, far: .02 };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
let D, R, W, H, S, DPR, stars = [], sel = null, hover = null, mouse = { x: 0, y: 0, px: 0, py: 0 };
const cam = { x: 0, y: 0, z: 1, tx: 0, ty: 0, tz: 1 };
let shooters = [], nextShoot = 2, glitch = 0, t0 = performance.now(), lastT = t0, selT = 0;

Promise.all([fetch('k626.json').then(r => r.json()), fetch('refs.json').then(r => r.json()).catch(() => ({}))]).then(([d, r]) => { D = d; R = r; setup(); requestAnimationFrame(frame); });

// ---------- background layers (made once per resize) ----------
let bg;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; S = Math.min(W, H * 1.25);
  CV.width = W * DPR; CV.height = H * DPR; X.setTransform(DPR, 0, 0, DPR, 0, 0);
  bg = [0, 1, 2].map(layer => { let s = 97 + layer * 31; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    return Array.from({ length: Math.round(W * H / (layer === 0 ? 2600 : layer === 1 ? 6000 : 14000)) }, () => ({ x: rnd() * W * 1.2 - W * .1, y: rnd() * H * 1.2 - H * .1, r: (layer + 1) * (rnd() * .45 + .25), a: rnd() * .6 + .2, tw: rnd() * 6.28, warm: rnd() < .12 })); });
}
addEventListener('resize', resize);

function setup() {
  document.getElementById('title').textContent = D.title;
  document.getElementById('intro').textContent = D.intro;
  document.getElementById('legend').innerHTML = D.rings.map(r => `<span><i style="color:${rgba(COL[r.id], 1)};background:${rgba(COL[r.id], 1)}"></i>${esc(r.label)}</span>`).join('');
  const byRing = {};
  D.stories.forEach(s => (byRing[s.ring] = byRing[s.ring] || []).push(s));
  for (const [ring, list] of Object.entries(byRing)) {
    const off = { near: .3, mid: 1.4, far: 2.6 }[ring];
    list.forEach((s, i) => stars.push({ s, ring, a: off + i * Math.PI * 2 / list.length, tw: Math.random() * 6.28, born: .2 + stars.length * .12 }));
  }
  resize();
  // list (also the keyboard / screen-reader way in)
  document.getElementById('listbox').innerHTML = D.rings.map(r => `<h3>${esc(r.label)}</h3>` + D.stories.filter(s => s.ring === r.id).map(s => `<button class="s" data-id="${s.id}">${esc(s.title)}</button>`).join('')).join('');
  document.querySelectorAll('#listbox .s').forEach(b => b.addEventListener('click', () => { closeList(); pick(b.dataset.id); }));
  document.getElementById('openList').addEventListener('click', () => { document.getElementById('list').classList.add('on'); document.querySelector('#listbox .s').focus(); });
  document.getElementById('list').addEventListener('click', e => { if (e.target.id === 'list') closeList(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') { closeList(); pick(null); } });
  CV.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; hover = hit(e.clientX, e.clientY); CV.classList.toggle('hot', !!hover || overCore(e.clientX, e.clientY)); });
  CV.addEventListener('click', e => { const h = hit(e.clientX, e.clientY); if (h) pick(h.s.id); else if (overCore(e.clientX, e.clientY)) { glitch = 1.2; pick(null); } else pick(null); });
}
function closeList() { document.getElementById('list').classList.remove('on'); }

// ---------- geometry ----------
const TILT = .58;
function world(st) { const r = RAD[st.ring] * S; return { x: Math.cos(st.a) * r, y: Math.sin(st.a) * r * TILT, depth: Math.sin(st.a) }; }
function toScreen(p) { return { x: W / 2 + (p.x - cam.x) * cam.z, y: H / 2 + 30 + (p.y - cam.y) * cam.z }; }
function hit(mx, my) { let best = null, bd = 26; for (const st of stars) { const p = toScreen(world(st)); const d = Math.hypot(p.x - mx, p.y - my); if (d < bd) { bd = d; best = st; } } return best; }
function overCore(mx, my) { const p = toScreen({ x: 0, y: 0 }); return Math.hypot(p.x - mx, p.y - my) < 46 * cam.z; }

// ---------- selection ----------
function pick(id) {
  sel = id ? stars.find(x => x.s.id === id) : null; selT = 0;
  const card = document.getElementById('card');
  document.getElementById('hint').style.opacity = 0;
  if (!sel) { card.classList.remove('on'); cam.tz = 1; cam.tx = 0; cam.ty = 0; return; }
  const s = sel.s, ring = D.rings.find(r => r.id === s.ring);
  const links = D.stories.filter(o => (s.links || []).includes(o.id) || (o.links || []).includes(s.id));
  card.innerHTML = `<button class="x" aria-label="閉じる">×</button>
    <div class="ring" style="color:${rgba(COL[s.ring], 1)}"><i></i>${esc(ring.label)}</div>
    <h2>${esc(s.title)}</h2>
    ${s.story.map((p, i) => `<p style="animation-delay:${.15 + i * .35}s">${esc(p)}</p>`).join('')}
    ${links.length ? `<div class="links">つながる星 ${links.map(o => `<button data-go="${o.id}">${esc(o.title)}</button>`).join('')}</div>` : ''}
    ${s.kakera.length ? `<div class="kakera"><small>かけら</small>${s.kakera.map(k => `<button data-k="${esc(k)}">${esc(k.split('|')[0])}</button>`).join('')}<div class="qq"></div></div>` : ''}`;
  card.classList.add('on'); card.scrollTop = 0;
  card.querySelector('.x').addEventListener('click', () => pick(null));
  card.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => pick(b.dataset.go)));
  card.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
    const was = b.classList.contains('open'); card.querySelectorAll('[data-k]').forEach(x => x.classList.remove('open'));
    const box = card.querySelector('.qq'); if (was) { box.innerHTML = ''; return; }
    b.classList.add('open'); const [ref, kw] = b.dataset.k.split('|'), r = R[ref];
    box.innerHTML = r ? `<div class="q">${clip(r[1], kw)}</div>` : '';
  }));
}
function clip(t, kw) {
  const i = kw ? t.indexOf(kw) : -1;
  if (i < 0) return esc(t.length > 220 ? t.slice(0, 220) + '…' : t);
  const a = Math.max(0, i - 90), b = Math.min(t.length, i + kw.length + 120);
  return (a ? '…' : '') + esc(t.slice(a, i)) + `<mark>${esc(kw)}</mark>` + esc(t.slice(i + kw.length, b)) + (b < t.length ? '…' : '');
}

// ---------- drawing ----------
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; const T = (now - t0) / 1000;
  // orbit (frozen while a story is open, so the camera can hold the star)
  if (!RM && !sel) for (const st of stars) st.a += SPD[st.ring] * dt;
  if (sel) { const p = world(sel); const narrow = W < 760; cam.tz = narrow ? 1.5 : 1.8; cam.tx = p.x + (narrow ? 0 : 140 / cam.tz); cam.ty = p.y + (narrow ? 110 / cam.tz : 0); selT += dt; }
  const k = RM ? 1 : 1 - Math.pow(.02, dt); cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k; cam.z += (cam.tz - cam.z) * k;
  mouse.px += (mouse.x - mouse.px) * .05; mouse.py += (mouse.y - mouse.py) * .05;

  X.globalCompositeOperation = 'source-over'; X.fillStyle = '#03050a'; X.fillRect(0, 0, W, H);
  nebula(T);
  starfield(T);
  if (!RM) shooting(dt);
  const core = toScreen({ x: 0, y: 0 });
  orbits();
  // depth: stars behind the core first
  const order = stars.map(st => ({ st, w: world(st) })).sort((a, b) => a.w.depth - b.w.depth);
  order.filter(o => o.w.depth < 0).forEach(o => drawStar(o.st, o.w, T));
  drawCore(core, T, dt);
  constellations(T);
  order.filter(o => o.w.depth >= 0).forEach(o => drawStar(o.st, o.w, T));
  requestAnimationFrame(frame);
}

function nebula(T) {
  X.globalCompositeOperation = 'lighter';
  const blobs = [[.22, .3, .55, [70, 40, 140], .13], [.78, .7, .6, [20, 90, 120], .12], [.55, .2, .4, [130, 60, 90], .07], [.4, .85, .5, [30, 60, 140], .08]];
  for (const [bx, by, br, c, a] of blobs) {
    const x = bx * W + Math.sin(T * .05 + bx * 9) * 30 - (mouse.px - W / 2) * .02, y = by * H + Math.cos(T * .04 + by * 7) * 24 - (mouse.py - H / 2) * .02;
    const g = X.createRadialGradient(x, y, 0, x, y, br * Math.max(W, H));
    g.addColorStop(0, rgba(c, a)); g.addColorStop(1, rgba(c, 0)); X.fillStyle = g; X.fillRect(0, 0, W, H);
  }
  X.globalCompositeOperation = 'source-over';
}
function starfield(T) {
  bg.forEach((layer, li) => {
    const par = [.006, .015, .03][li], zoom = 1 + (cam.z - 1) * [.05, .12, .25][li];
    const ox = -(mouse.px - W / 2) * par - cam.x * [.02, .05, .1][li], oy = -(mouse.py - H / 2) * par - cam.y * [.02, .05, .1][li];
    for (const s of layer) {
      const a = s.a * (RM ? 1 : .65 + .35 * Math.sin(T * (1.2 + li * .4) + s.tw));
      const x = (s.x - W / 2) * zoom + W / 2 + ox, y = (s.y - H / 2) * zoom + H / 2 + oy;
      X.globalAlpha = a; X.fillStyle = s.warm ? '#ffe7b5' : '#e8f0ff';
      X.beginPath(); X.arc(x, y, s.r, 0, 6.283); X.fill();
    }
  });
  X.globalAlpha = 1;
}
function shooting(dt) {
  nextShoot -= dt;
  if (nextShoot < 0) { nextShoot = 4 + Math.random() * 6; const ang = .5 + Math.random() * .5; shooters.push({ x: Math.random() * W * .8, y: Math.random() * H * .3, vx: Math.cos(ang) * 700, vy: Math.sin(ang) * 700, life: 1 }); }
  for (const s of shooters) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 1.1;
    const g = X.createLinearGradient(s.x, s.y, s.x - s.vx * .12, s.y - s.vy * .12);
    g.addColorStop(0, `rgba(255,255,255,${Math.max(0, s.life)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    X.strokeStyle = g; X.lineWidth = 1.4; X.beginPath(); X.moveTo(s.x, s.y); X.lineTo(s.x - s.vx * .12, s.y - s.vy * .12); X.stroke();
  }
  shooters = shooters.filter(s => s.life > 0);
}
function orbits() {
  const c = toScreen({ x: 0, y: 0 });
  D.rings.forEach(r => {
    const rx = RAD[r.id] * S * cam.z, ry = rx * TILT;
    X.save(); X.strokeStyle = rgba(COL[r.id], .16); X.lineWidth = 1; X.setLineDash(r.id === 'near' ? [] : r.id === 'mid' ? [6, 6] : [2, 7]);
    X.beginPath(); X.ellipse(c.x, c.y, rx, ry, 0, 0, 6.283); X.stroke(); X.restore();
  });
}
function drawCore(c, T, dt) {
  const z = cam.z, pulse = RM ? 1 : 1 + .06 * Math.sin(T * 2.2);
  X.globalCompositeOperation = 'lighter';
  for (const [r, a] of [[160, .05], [90, .11], [48, .22]]) {
    const g = X.createRadialGradient(c.x, c.y, 0, c.x, c.y, r * z * pulse);
    g.addColorStop(0, `rgba(160,240,255,${a})`); g.addColorStop(1, 'rgba(160,240,255,0)'); X.fillStyle = g; X.beginPath(); X.arc(c.x, c.y, r * z * pulse, 0, 6.283); X.fill();
  }
  // accretion ring
  X.save(); X.translate(c.x, c.y); X.scale(1, TILT);
  for (let i = 0; i < 3; i++) {
    X.rotate(RM ? 0 : T * (.25 + i * .07));
    X.strokeStyle = `rgba(${[150, 230, 255][i]},${[220, 200, 180][i]},255,${.25 - i * .06})`; X.lineWidth = (3 - i) * z;
    X.beginPath(); X.arc(0, 0, (58 + i * 9) * z, 0, 4.2); X.stroke();
  }
  X.restore();
  // jets
  if (!RM) { const jl = (120 + 30 * Math.sin(T * 1.7)) * z; for (const d of [-1, 1]) { const g = X.createLinearGradient(c.x, c.y, c.x + d * 8 * z, c.y - d * jl); g.addColorStop(0, 'rgba(180,240,255,.35)'); g.addColorStop(1, 'rgba(180,240,255,0)'); X.strokeStyle = g; X.lineWidth = 2 * z; X.beginPath(); X.moveTo(c.x, c.y); X.lineTo(c.x + d * 8 * z, c.y - d * jl); X.stroke(); } }
  X.globalCompositeOperation = 'source-over';
  X.fillStyle = '#05080e'; X.beginPath(); X.arc(c.x, c.y, 34 * z, 0, 6.283); X.fill();
  X.strokeStyle = 'rgba(160,240,255,.8)'; X.lineWidth = 1.6 * z; X.stroke();
  X.fillStyle = '#eafcff'; X.font = `600 ${17 * z}px "Hiragino Sans","Yu Gothic UI",sans-serif`; X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText('K626', c.x, c.y);
  // redaction glitch: black bars flicker over the name now and then
  if (!RM) { glitch -= dt; if (glitch < -3 - Math.random() * 4) glitch = .35; }
  if (glitch > 0) { X.fillStyle = '#000'; for (let i = 0; i < 3; i++) X.fillRect(c.x - 26 * z + Math.random() * 30 * z, c.y - 8 * z + (Math.random() - .5) * 12 * z, (10 + Math.random() * 22) * z, 5 * z); }
}
function drawStar(st, w, T) {
  const p = toScreen(w), col = COL[st.ring], isSel = sel === st, isHover = hover === st;
  const linked = sel && ((sel.s.links || []).includes(st.s.id) || (st.s.links || []).includes(sel.s.id));
  const intro = Math.min(1, Math.max(0, (T - st.born) / .8));
  const dim = sel && !isSel && !linked ? .28 : 1;
  const depthA = .55 + .45 * (w.depth + 1) / 2;
  const base = { near: 6.5, mid: 5.5, far: 4.6 }[st.ring] * (1 + .25 * w.depth * .5);
  const tw = RM ? 1 : 1 + .18 * Math.sin(T * 2.4 + st.tw);
  const r = base * tw * cam.z * (isSel ? 1.5 : isHover ? 1.3 : 1) * intro;
  const a = depthA * dim * intro;
  X.globalCompositeOperation = 'lighter';
  const g = X.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 5);
  g.addColorStop(0, rgba(col, .55 * a)); g.addColorStop(1, rgba(col, 0)); X.fillStyle = g; X.beginPath(); X.arc(p.x, p.y, r * 5, 0, 6.283); X.fill();
  // spikes
  X.strokeStyle = rgba(col, .7 * a); X.lineWidth = 1;
  const sp = r * (st.ring === 'near' ? 3.4 : st.ring === 'mid' ? 2.6 : 2);
  X.beginPath(); X.moveTo(p.x - sp, p.y); X.lineTo(p.x + sp, p.y); X.moveTo(p.x, p.y - sp); X.lineTo(p.x, p.y + sp); X.stroke();
  X.globalCompositeOperation = 'source-over';
  X.fillStyle = `rgba(255,255,255,${a})`; X.beginPath(); X.arc(p.x, p.y, r * .55, 0, 6.283); X.fill();
  if (isSel) { X.strokeStyle = rgba(col, .8); X.lineWidth = 1.2; X.beginPath(); X.arc(p.x, p.y, r * 2.4 + Math.sin(T * 3) * 2, 0, 6.283); X.stroke(); }
  // label
  const showLabel = isSel || isHover || linked || (!sel && W >= 760);
